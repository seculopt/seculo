<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose a new Século Explorer password." />
  <title>Reset Password — Século Explorer</title>
  <!-- Favicons — the S from the wordmark, reversed out of brand ink. -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />


  <!-- Set before first paint so scroll-reveal elements are only hidden when
       JS is actually available to reveal them again. -->
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@200;300;400;500;600;700&family=Zalando+Sans+Expanded:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <style>
    .auth-page {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--color-bg);
    }
    .auth-card {
      background: var(--color-white);
      border: 1px solid var(--color-divider);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(25,25,39,0.07);
    }
    .auth-logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      color: var(--color-mid);
      font-size: 0.88rem;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-field {
      margin-bottom: 1rem;
    }
    .auth-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--color-mid);
      margin-bottom: 0.35rem;
    }
    .auth-field input {
      width: 100%;
      border: 1px solid var(--color-divider);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: var(--font-body);
      color: var(--color-primary);
      background: var(--color-white);
      transition: border-color 0.15s;
    }
    .auth-field input:focus {
      outline: none;
      border-color: var(--color-accent);
    }
    .auth-btn {
      width: 100%;
      margin-top: 0.5rem;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--color-mid);
      font-size: 0.8rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-divider);
    }
    .auth-alt {
      text-align: center;
      font-size: 0.82rem;
      color: var(--color-mid);
    }
    .auth-alt a {
      color: var(--color-accent);
      text-decoration: none;
    }
    .auth-alt a:hover { text-decoration: underline; }
    .auth-message {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }
    .auth-message--success {
      background: #f0faf4;
      border: 1px solid #a8d5b5;
      color: #27664a;
      display: block;
    }
    .auth-message--error {
      background: var(--color-raised);
      border: 1px solid var(--rule-strong);
      color: var(--brand-terracotta);
      display: block;
    }
    .auth-footer-note {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--color-divider);
      text-align: center;
      font-size: 0.78rem;
      color: var(--color-mid);
    }
    .auth-footer-note a { color: var(--color-mid); }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo" aria-label="Século Explorer — Home">
        <img src="assets/logo.svg" alt="Século Explorer" />
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-en="Home" data-pt="Início" data-es="Inicio">Home</a></li>
        <li><a href="index.html#how-it-works" data-en="How It Works" data-pt="Como Funciona" data-es="Cómo Funciona">How It Works</a></li>
        <li><a href="index.html#use-cases" data-en="Use Cases" data-pt="Casos de Uso" data-es="Casos de Uso">Use Cases</a></li>
        <li><a href="products.html" data-en="Plans" data-pt="Planos" data-es="Planes">Plans</a></li>
        <li><a href="https://luneta.seculopt.com/" data-en="Market Map" data-pt="Mapa do Mercado" data-es="Mapa del Mercado">Market Map</a></li>
        <li><a href="login.html" class="nav-login" data-en="Log In" data-pt="Entrar" data-es="Entrar">Log In</a></li>
        <li>
          <a href="https://seculo-api.vercel.app/?tier=free" class="btn btn-primary" data-en="Try For Free" data-pt="Experimenta Grátis" data-es="Pruébalo Gratis">Try For Free</a>
        </li>
      </ul>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="en">EN</button>
        <span>/</span>
        <button class="lang-btn" data-lang="pt">PT</button>
        <span>/</span>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- AUTH CARD -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">SÉCULO</div>

      <h1 class="auth-title" data-en="Choose a new password" data-pt="Escolhe uma nova password" data-es="Elige una nueva contraseña">Choose a new password</h1>

      <p id="waiting-notice" class="auth-subtitle"
        data-en="Verifying your link…"
        data-pt="A verificar o teu link…"
        data-es="Verificando tu enlace…">Verifying your link…</p>

      <form id="reset-form" style="display:none">
        <p class="auth-subtitle"
          data-en="Minimum 8 characters."
          data-pt="Mínimo de 8 caracteres."
          data-es="Mínimo 8 caracteres.">Minimum 8 characters.</p>
        <div class="auth-field">
          <label for="password-input" data-en="New password" data-pt="Nova password" data-es="Nueva contraseña">New password</label>
          <div style="position:relative">
            <input type="password" id="password-input" required minlength="8" autocomplete="new-password" placeholder="••••••••" style="width:100%;padding-right:2.8rem" />
            <button type="button" class="toggle-pw" data-target="password-input"
              style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-mid);font-size:0.85rem;padding:0.2rem"
              aria-label="Show/hide password">👁</button>
          </div>
        </div>
        <div class="auth-field">
          <label for="password2-input" data-en="Confirm password" data-pt="Confirmar password" data-es="Confirmar contraseña">Confirm password</label>
          <div style="position:relative">
            <input type="password" id="password2-input" required minlength="8" autocomplete="new-password" placeholder="••••••••" style="width:100%;padding-right:2.8rem" />
            <button type="button" class="toggle-pw" data-target="password2-input"
              style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-mid);font-size:0.85rem;padding:0.2rem"
              aria-label="Show/hide password">👁</button>
          </div>
        </div>
        <button type="submit" id="reset-btn" class="btn btn-primary auth-btn" data-en="Save new password" data-pt="Guardar nova password" data-es="Guardar nueva contraseña">Save new password</button>
      </form>

      <p id="reset-message" class="auth-message"></p>

      <div class="auth-divider" data-en="or" data-pt="ou" data-es="o">or</div>
      <p class="auth-alt">
        <a href="forgot-password.html" data-en="Request a new link" data-pt="Pedir um novo link" data-es="Pedir un nuevo enlace">Request a new link</a>
      </p>

      <div class="auth-footer-note">
        <a href="privacy-policy.html" data-en="Privacy Policy" data-pt="Política de Privacidade" data-es="Política de Privacidad">Privacy Policy</a>
        &nbsp;·&nbsp;
        <a href="mailto:support@seculopt.com">support@seculopt.com</a>
      </div>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="js/nav.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/cookies.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/auth-reset.js"></script>

</body>
</html>
